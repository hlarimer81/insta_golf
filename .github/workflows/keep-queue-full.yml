# Keeps the Instagram queue stocked and mails a weekly read of how it's going.
#
# The queue drained on 2026-08-31 and the account sat dark for nine days before
# anyone noticed. The top-up job runs every morning and is a no-op on most days;
# that's what makes it self-healing rather than a weekly gamble.
#
# AWS access is via OIDC role assumption — no long-lived keys in this repo.
name: Keep queue full

on:
  schedule:
    - cron: "0 6 * * *"    # daily, well before the 13:00 UTC poster firing
    - cron: "0 14 * * 1"   # Mondays, after that day's post has gone out
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [topup, babies, report, both]
        default: both
      # Raising min above the number of posts already queued forces a real
      # staging run, which is the only way to exercise the render path on a
      # runner while the queue is healthy. The daily schedule ignores these.
      min:
        description: Top up when fewer than this many posts remain (blank = 10)
        type: string
        default: ""
      target:
        description: Stage back up to this many posts (blank = 20)
        type: string
        default: ""

# Action versions: the lowest that run on Node 24, not the newest available.
# Node 20 is deprecated on runners, which is the only reason to move; every
# further major carries breaking changes this pipeline gains nothing from
# (setup-node v5+ reworks automatic cache detection, v7 migrates to ESM).
# checkout and setup-node reached Node 24 at v5, configure-aws-credentials at
# v6 -- its v5 is still Node 20, so bumping it to v5 would have left the
# warning in place.

permissions:
  id-token: write    # required to assume the AWS role via OIDC
  contents: write    # the top-up commits newly generated scripts back
  issues: write      # the weekly report is delivered as an issue

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::103690404054:role/insta-golf-github-actions
  S3_BUCKET: insta-golf-103690404054-us-east-1-an

jobs:
  # Tips were retired on 2026-11-20 for two babies Reels a day, so this job no
  # longer stages anything; it only records the follower count. The job id
  # stays "topup" so existing dispatches still work. ensure-queue refuses to
  # stage tips without --allow-tips, as a second guard.
  topup:
    name: Record the follower count
    if: github.event.schedule == '0 6 * * *' || inputs.job == 'topup' || inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Instagram keeps no follower history for an account this size, so the
      # count is recorded daily or not at all. No longer allowed to fail
      # quietly: it is this job's only step, and a red run here is the
      # earliest sign the IG token has stopped working.
      - name: Record the follower count
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run followers

  # The golf-babies lane, now the only one: two Reels a day, due 12:00 and
  # 20:00 UTC (the 13:00 and 21:00 poster firings), taking the morning slot as
  # the last queued tips post out. Clips render on Gemini Omni Flash, about a
  # minute each. Tops up below 10 posts (5 days) back to 20 (10 days).
  babies:
    name: Top up the babies queue
    if: github.event.schedule == '0 6 * * *' || inputs.job == 'babies'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Top up if the babies queue is below 5 days
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Only used if BABIES_VIDEO_MODEL is set back to a fal.ai model.
          FAL_KEY: ${{ secrets.FAL_KEY }}
          BABIES_VIDEO_MODEL: ${{ vars.BABIES_VIDEO_MODEL }}
          MIN: ${{ inputs.min }}
          TARGET: ${{ inputs.target }}
        run: npm run ensure:queue -- --lane babies --min "${MIN:-10}" --target "${TARGET:-20}"

      # Commit even when a render failed: the sketches that did render are
      # already queued, and the generator needs them in scripts/ to avoid
      # writing the same premise again.
      - name: Commit any new scripts
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain scripts/)" ]; then
            echo "No new scripts — babies queue was already stocked."
            exit 0
          fi
          git config user.name "insta-golf bot"
          git config user.email "actions@github.com"
          git add scripts/
          git commit -m "Top up the babies queue

          Staged automatically because the babies queue fell below 10 posts.

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git pull --rebase origin main
          git push

  report:
    name: Weekly report
    if: github.event.schedule == '0 14 * * 1' || inputs.job == 'report' || inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and send the report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REPORT_FROM: ${{ vars.REPORT_FROM }}
          REPORT_TO: ${{ vars.REPORT_TO }}
        run: npm run report

      # SES mail "from" a gmail.com address does not come from Google, so Gmail
      # has every reason to bin it as spoofed -- and in two months not one report
      # reached the inbox. An issue is mailed by GitHub itself, and the @mention
      # makes that notification certain.
      - name: Post the report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          { cat out/report.md; echo; echo "cc @$OWNER"; } > out/issue.md
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "$(cat out/report-subject.txt)" --body-file out/issue.md
